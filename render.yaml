services:
  # ----------------------------------------------------
  # 1) Backend Service (Express + MongoDB API)
  # ----------------------------------------------------
  - type: web
    name: abktechs-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node seed.js && npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://abktechs-frontend.onrender.com
      - key: FRONTEND_URL
        value: https://abktechs-frontend.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      
      # IMPORTANT: You must manually fill these in the Render Dashboard after deployment!
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # ----------------------------------------------------
  # 2) Frontend Service (Next.js Application)
  # ----------------------------------------------------
  - type: web
    name: abktechs-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://abktechs-backend.onrender.com/api/v1
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://abktechs-backend.onrender.com/api/v1
